# =====================================================================
# Luna & Latte Café Platform - Spring Boot Configuration
# =====================================================================
spring.application.name=luna-and-latte-cafe
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------------------------------------------------------------------
# Microsoft SQL Server Database Configuration
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=luna_latte_db;encrypt=true;trustServerCertificate=true;
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=YourStrong!Passw0rd

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------
# Flyway Database Migration Configuration
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,filesystem:../database/migrations
spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------
# JWT Security Configuration
# ---------------------------------------------------------------------
# 256-bit secret key for HMAC-SHA256
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 24 hours in milliseconds (86400000)
jwt.expiration=86400000

# ---------------------------------------------------------------------
# File / Multipart configuration
# ---------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
